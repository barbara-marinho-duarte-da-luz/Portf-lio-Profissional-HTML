<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <body class="bg-light"></body>
    <!--text-center->centraliza texto; text-primary ->aplica cor padrão; mt-5_> espaçamento no topo-->
    <!--navbar:define elemento como barra de navegação; navbar-expand-lg: Controla a responsividade: 
    em telas grandes o menu aparece aberto, em telas menores vira botão; navbar-dark bg-dark: define
    fundo escuro e cor texto (visual); sticky-top: mantém menu fixo no topo; container: centraliza e
    organiza conteúdo, alinhando-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Barbara Marinho.dev</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bstarget="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#perfil">Perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#projetos">Projetos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contato">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--carousel slide: cria o componente de slides; carousel-fade: add efeito de transição
    suave entre os slides; carousel-indicators: cria os pequenos botões de navegação; 
    carousel-inner: agrupa todos os slides; carousel-item-: define slide individual;
    active: marca qual slide começa primeiro; carousel-control-prev/next: criam os botões
    de voltar e avançar-->
    <div id="carouselPortfolio" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselPortfolio" data-bs-slide-to="0"
                    class="active"></button>
            <button type="button" data-bs-target="#carouselPortfolio" data-bs-slideto="1"></button>
            <button type="button" data-bs-target="#carouselPortfolio" data-bs-slideto="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="imagem1.jpeg" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="imagem2.jpeg" class="d-block w-100" alt="Slide 2">
            </div>
            <div class="carousel-item">
                <img src="imagem3.jpeg" class="d-block w-100" alt="Slide 3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselPortfolio"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselPortfolio"
                data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
